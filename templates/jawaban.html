<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Evaluasi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
        }
        h2 {
            color: #333;
        }
        .result-box {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .conclusion {
            background-color: #ffc107;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
        .back-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
        }
        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hasil Evaluasi Gejala</h2>
        <div class="result-box">
            <h3>Jawaban Anda:</h3>
            <ul>
                {% for key, answer in responses.items() %}
                    <li><strong>{{ key }}:</strong> {{ answer }}</li>
                {% endfor %}
            </ul>
        </div>
        <div class="conclusion">
            <h3>Kesimpulan:</h3>
            <p>{{ kesimpulan }}</p>
        </div>
        <a href="/" class="back-button">Kembali</a>
    </div>
</body>
</html>
