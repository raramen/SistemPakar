<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Evaluasi Risiko Diabetes</title>
</head>
<body>
    <h2>Evaluasi Risiko Diabetes</h2>
    <form action="/" method="post">
        {% for key, question in gejala_list.items() %}
            <label for="{{ key }}">{{ question }}</label>
            <input type="number" step="any" name="{{ key }}" required>
            <br>
        {% endfor %}
        <button type="submit">Kirim</button>
    </form>
</body>
</html>
