<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Analisis Fuzzy</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome (ikon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            color: white;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            margin: auto;
            text-align: left;
            color: black;
        }
        .badge {
            font-size: 1rem;
            padding: 8px 12px;
        }
        .result-box {
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }
        .low { background-color: #28a745; color: white; }
        .medium { background-color: #ffc107; color: black; }
        .high { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center"><i class="fas fa-heartbeat"></i> Hasil Analisis</h2>
        <hr>

        <p><strong><i class="fas fa-user"></i> Usia:</strong> {{ age }} tahun 
            <span class="badge {{ age_class }}">{{ age_category }}</span>
        </p>

        <p><strong><i class="fas fa-tint"></i> Kadar Kolesterol:</strong> {{ chol }} mg/dL 
            <span class="badge {{ chol_class }}">{{ chol_category }}</span>
        </p>

        <p><strong><i class="fas fa-chart-line"></i> Depresi ST:</strong> {{ oldpeak }} 
            <span class="badge {{ oldpeak_class }}">{{ oldpeak_category }}</span>
        </p>

        <div class="result-box {{ risk_class }}">
            <h5><i class="fas fa-exclamation-circle"></i> {{ risk_message }}</h5>
        </div>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-outline-primary"><i class="fas fa-arrow-left"></i> Kembali</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
