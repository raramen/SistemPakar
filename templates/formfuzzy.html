<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Analisis Fuzzy</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            color: white;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            margin: auto;
            color: black;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center"><i class="fas fa-heartbeat"></i> Form Analisis</h2>
        <hr>
        <form action="/result" method="post">
            <div class="mb-3">
                <label for="age" class="form-label">Usia (Tahun)</label>
                <input type="number" class="form-control" id="age" name="age" required>
            </div>
            <div class="mb-3">
                <label for="chol" class="form-label">Kadar Kolesterol (mg/dL)</label>
                <input type="number" class="form-control" id="chol" name="chol" required>
            </div>
            <div class="mb-3">
                <label for="oldpeak" class="form-label">Depresi ST</label>
                <input type="number" step="0.1" class="form-control" id="oldpeak" name="oldpeak" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Kirim</button>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
